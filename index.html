<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="assets/feather.svg" type="image/svg+xml"><title>AI Clipboard</title><link rel="stylesheet" href="style.css"></head>
<body><header aria-hidden="true"></header>
<div id="actions" popover>
<nav aria-label="Clip actions"><button id="paste" data-label>Paste new clip</button><button id="open" data-label>Open</button><button id="copy" data-label>Copy Markdown</button><button id="save" data-label>Save .md</button></nav>
<div class="menu-heading"><span data-label>History</span><button id="delete" data-label>Delete selected clip</button></div><div id="history"></div>
<button id="browser-settings" data-label>Settings</button>
<div class="window-controls"><button id="minimize" data-label>Minimize</button><button id="hide" data-label>Hide to tray</button><button id="quit" data-label>Quit</button><small id="hotkey">Ctrl + Alt + Space</small></div><span id="status" role="status"></span></div>
<dialog id="settings" aria-labelledby="settings-title"><h2 id="settings-title" data-label>Settings</h2><div class="color-row"><label for="background" data-label>Background</label><input id="background" type="color" value="#f5f2e9"><button id="reset-color" data-label>Reset to cream</button></div><form method="dialog"><button data-label>Done</button></form></dialog>
<span id="filename" hidden></span><main aria-label="Clip"></main>
<input type="file" accept=".md,.markdown,.txt,text/plain" hidden>
<script src="vendor/markdown-it.min.js"></script><script src="vendor/turndown.min.js"></script><script src="vendor/turndown-gfm.min.js"></script><script src="locale.js"></script><script src="images.js"></script><script src="editor.js"></script><script src="history.js"></script><script src="appearance.js"></script><script src="app.js"></script></body></html>
